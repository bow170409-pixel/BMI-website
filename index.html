<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BMI Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2c9ac;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #e07a5f;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #d46a50;
    }

    .result {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>BMI Calculator</h2>

  <div class="field">
    <label>🏋️ Weight (kg)</label>
    <input type="number" id="weight">
  </div>

  <div class="field">
    <label>📏 Height (m)</label>
    <input type="number" step="0.01" id="height">
  </div>

  <button onclick="calcBMI()">Calculate</button>

  <div class="result" id="result"></div>
</div>

<script>
  function calcBMI() {
    const w = document.getElementById("weight").value;
    const h = document.getElementById("height").value;

    if (!w || !h) {
      document.getElementById("result").innerText =
        "Please enter weight and height.";
      return;
    }

    const bmi = (w / (h * h)).toFixed(1);
    let status = "";

    if (bmi < 18.5) status = "Underweight";
    else if (bmi < 25) status = "Normal";
    else if (bmi < 30) status = "Overweight";
    else if (bmi < 35) status = "Obesity Class I";
    else if (bmi < 40) status = "Obesity Class II";
    else status = "Obesity Class III";

    document.getElementById("result").innerHTML =
      `Your BMI is <b>${bmi}</b><br>You are <b>${status}</b>`;
  }
</script>

</body>
</html>
