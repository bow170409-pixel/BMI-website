        <tr>
            <td>18.5 – 24.9</td>

        <tr>
            <td>25 – 29.9</td>

        </tr>
        <tr>

        <tr>
            <td>35 – 39.9</td>

        </tr>
        <tr>
            <td>≥ 40</td>

        </tr>
    </table>
</div>
